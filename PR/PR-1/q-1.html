<!DOCTYPE html>
<html>

<head>
    <title>Celcius(Q-1)</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            color: teal;
        }

        h2 {
            color: maroon;
        }
    </style>
</head>

<body>
    <h1>Celcius to Fehrenhiet</h1>
    <script>
        let Celcius = +prompt("Enter the Celcius")

        let fehre = (Celcius * (9 / 5)) + 32

        document.write(`<h2>Fehrenhiet : ${fehre}</h2>`);

    </script>
</body>

</html>
