<!DOCTYPE html>
<html>

<head>
    <title>Third Angle of Triangle(Q-3)</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            color: teal;
        }

        h2 {
            color: maroon;
        }
    </style>
</head>

<body>
    <h1>Third Angle of Triangle</h1>
    <script>

        let first = +prompt("Enter first angle of triangle")
        let second = +prompt("Enter second angle of triangle")

        let deg = 180

        let total = deg - first - second;

        document.write(`<h2>Third Angle of Triangle :- ${total}</h2>`);
    </script>
</body>

</html>
